<svg class="fx-anim-video" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
.fx-anim-video path{ stroke-dasharray:100; stroke-dashoffset:100; animation: fitz-draw-video 2.4s ease-in-out infinite; }
@keyframes fitz-draw-video{ 0%{stroke-dashoffset:100;} 40%{stroke-dashoffset:0;} 60%{stroke-dashoffset:0;} 100%{stroke-dashoffset:100;} }
