<svg class="fx-anim-clock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fx-draw-clock">
  <style>
.fx-anim-clock path{ stroke-dasharray:100; stroke-dashoffset:100; animation: fitz-draw-clock 2.4s ease-in-out infinite; }
@keyframes fitz-draw-clock{ 0%{stroke-dashoffset:100;} 40%{stroke-dashoffset:0;} 60%{stroke-dashoffset:0;} 100%{stroke-dashoffset:100;} }
@media (prefers-reduced-motion: reduce){ .fx-anim-clock path{ animation:none !important; stroke-dasharray:none !important; stroke-dashoffset:0 !important; } }
  </style>
<path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z" pathLength="100"/><path d="M12 6v6l4 2" pathLength="100"/>
</svg>
