<svg class="fx-anim-chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fx-draw-chevron-right">
  <style>
.fx-anim-chevron-right path{ stroke-dasharray:100; stroke-dashoffset:100; animation: fitz-draw-chevron-right 2.4s ease-in-out infinite; }
@keyframes fitz-draw-chevron-right{ 0%{stroke-dashoffset:100;} 40%{stroke-dashoffset:0;} 60%{stroke-dashoffset:0;} 100%{stroke-dashoffset:100;} }
@media (prefers-reduced-motion: reduce){ .fx-anim-chevron-right path{ animation:none !important; stroke-dasharray:none !important; stroke-dashoffset:0 !important; } }
  </style>
<path d="M9 18l6-6-6-6" pathLength="100"/>
</svg>
