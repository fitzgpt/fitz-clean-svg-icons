<svg class="fx-anim-chevron-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fx-draw-chevron-up">
  <style>
.fx-anim-chevron-up path{ stroke-dasharray:100; stroke-dashoffset:100; animation: fitz-draw-chevron-up 2.4s ease-in-out infinite; }
@keyframes fitz-draw-chevron-up{ 0%{stroke-dashoffset:100;} 40%{stroke-dashoffset:0;} 60%{stroke-dashoffset:0;} 100%{stroke-dashoffset:100;} }
@media (prefers-reduced-motion: reduce){ .fx-anim-chevron-up path{ animation:none !important; stroke-dasharray:none !important; stroke-dashoffset:0 !important; } }
  </style>
<path d="M18 15l-6-6-6 6" pathLength="100"/>
</svg>
