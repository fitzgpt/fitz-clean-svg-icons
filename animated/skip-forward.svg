<svg class="fx-anim-skip-forward" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
.fx-anim-skip-forward path{ stroke-dasharray:100; stroke-dashoffset:100; animation: fitz-draw-skip-forward 2.4s ease-in-out infinite; }
@keyframes fitz-draw-skip-forward{ 0%{stroke-dashoffset:100;} 40%{stroke-dashoffset:0;} 60%{stroke-dashoffset:0;} 100%{stroke-dashoffset:100;} }
@media (prefers-reduced-motion: reduce){ .fx-anim-skip-forward path{ animation:none !important; stroke-dasharray:none !important; stroke-dashoffset:0 !important; } }
